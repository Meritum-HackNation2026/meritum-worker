name: CI/CD

# One run per commit (push only; a PR shows the run of its head commit).
#   lint, tests  in parallel on the GCP runners (self-hosted, meritum); a newer
#                push to the same branch cancels them, never on main/develop.
#   deploy       develop -> meritum-worker-dev, main -> meritum-worker-prd, on dellpromaxgb10,
#                after lint and tests pass; never cancelled mid-way, one at a time.
# meritum-core is a private git dependency: every job reads it with the
# read-only deploy key in the repo secret MERITUM_CORE_SSH_KEY (org secrets do not
# reach private repos on the Free plan).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_KEY: ${{ secrets.MERITUM_CORE_SSH_KEY }}

jobs:
  lint:
    runs-on: [self-hosted, meritum]
    timeout-minutes: 10
    concurrency:
      group: ci-lint-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &core-key
        name: Access to meritum-core
        run: |
          key="$RUNNER_TEMP/core_key" # RUNNER_TEMP is emptied after every job
          install -m 600 /dev/null "$key" && printf '%s\n' "$CORE_KEY" >"$key"
          echo "GIT_SSH_COMMAND=ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/deploy/github_known_hosts" >>"$GITHUB_ENV"
      - &setup-uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false # ~/.cache/uv stays on the self-hosted runner
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run python scripts/check_conventions.py # docstrings, Features:, constants, 250 lines
      - run: uv run vulture # dead code
      - run: uv run bandit -c pyproject.toml -r src scripts # security (ruff S runs the same rules)

  tests:
    runs-on: [self-hosted, meritum]
    timeout-minutes: 15
    concurrency:
      group: ci-tests-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *core-key
      - *setup-uv
      - run: uv sync --locked
      - run: uv run pytest # includes tests/architecture (pytestarch); skips -m integration
      - run: uv run behave # scenarios from features/

  deploy:
    needs: [lint, tests]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dellpromaxgb10]
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy
        env: # the names in worker_secrets of deploy/deploy.sh
          EUVSDISINFO_MCP_API_KEY: ${{ secrets.EUVSDISINFO_MCP_API_KEY }}
          # D9 (core#97): Claude Haiku 5.5 via OpenRouter; one key per env. prd uses it once
          # meritum-infra sets MERITUM_LLM_PROVIDER=openrouter in worker-prd.env.
          OPENROUTER_API_KEY: ${{ github.ref_name == 'main' && secrets.OPENROUTER_API_KEY_PRD || secrets.OPENROUTER_API_KEY_DEV }}
        run: |
          export CORE_KEY_FILE="$RUNNER_TEMP/core_key"
          install -m 600 /dev/null "$CORE_KEY_FILE" && printf '%s\n' "$CORE_KEY" >"$CORE_KEY_FILE"
          deploy/deploy.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
