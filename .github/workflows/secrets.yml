name: Secrets

# gitleaks over the whole git history on every push and PR; any finding fails
# the run (output is redacted). The binary is pinned by version and SHA-256 and
# runs on the GCP runners; gitleaks-action is not used because it needs a paid
# licence for organisations. Justified false positives go to .gitleaks.toml.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: [self-hosted, meritum]
    timeout-minutes: 5
    concurrency:
      group: secrets-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit still counts
      - name: Install gitleaks
        run: |
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'
