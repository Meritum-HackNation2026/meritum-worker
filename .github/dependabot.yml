# Dependabot version updates: one weekly PR per ecosystem for minor and patch
# (grouped), separate PRs for major, at most 5 open per ecosystem.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: Zależności
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned by the bump workflow in meritum-core, never by Dependabot. uv still
      # reads it over ssh to lock: the org grants Dependabot access to meritum-core
      # (Settings > Advanced Security > Global settings), no token here.
      - dependency-name: meritum-core
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: Docker
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      - dependency-name: python
      - dependency-name: ghcr.io/astral-sh/uv
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: CI
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
